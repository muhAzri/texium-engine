<title>TeX engine files</title>
<p>Static files of the BusyTeX TeX engine (TeX Live in WebAssembly), served for Texium.</p>
<p>The engine bundles TeX Live programs, each under its own free-software license (pdfTeX and LuaTeX: GPL).
Source: <a href="https://github.com/busytex/busytex">github.com/busytex/busytex</a>
and <a href="https://tug.org/texlive/svn/">tug.org/texlive</a>.</p>
